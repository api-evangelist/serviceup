apis:
- name: ServiceUp MCP Server
  description: 'Live Model Context Protocol server operated by ServiceUp at api.serviceup.com/mcp,
    exposing the agentic repair platform to MCP clients. The endpoint is protected
    by OAuth 2.1 (authorization code + PKCE S256) and advertises RFC 9728 protected-resource
    metadata naming auth.serviceup.com as its authorization server and mcp:read /
    mcp:write as its scopes. Discovered by probe — ServiceUp publishes no developer
    documentation for it.'
