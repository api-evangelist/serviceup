aid: serviceup
name: ServiceUp
description: 'ServiceUp is an agentic vehicle repair and maintenance platform for commercial
  fleets, insurance carriers and repair shops, founded in 2021 and headquartered in
  Los Gatos, California. The platform centralizes the full repair lifecycle — intake,
  shop routing, estimate and invoice approval, repair status tracking and payment —
  across collision, mechanical and preventative maintenance work, and layers AI Repair
  Agents over it that run in manual, co-pilot or autopilot control modes. ServiceUp
  integrates with existing fleet management systems, telematics providers and rental
  management systems, and operates a live, OAuth-2.1-protected Model Context Protocol
  (MCP) server at api.serviceup.com/mcp for agent access. The company raised a $55M
  Series B and ranked 77th on the 2025 Inc. 5000 list.'
